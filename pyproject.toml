[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-reliability-observatory"
version = "2.0.0"
description = "Enterprise RAG Diagnostic Platform: Decoupled Retrieval, Ranking Degradation, Evidence Grounding & Failure Attribution"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Munir", email = "master72o@users.noreply.github.com" }
]
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.22.0",
    "pandas>=1.5.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.0.0",
    "pyyaml>=6.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
rag-observatory = "rag_observatory.cli:main"
rag-eval = "rag_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["rag_observatory*", "rag_eval*"]
